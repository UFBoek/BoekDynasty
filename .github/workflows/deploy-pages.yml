name: Deploy Boek Dynasty to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app and queue sync
        run: |
          node --check src/client.js
          node scripts/build-worker-proxy.mjs
          node --check dist/worker-proxy.js
          node --test tests/draft-queue.test.mjs tests/client-startup.test.mjs
      - name: Build frontend
        env:
          BOEK_API_BASE: ${{ vars.BOEK_API_BASE }}
        run: node scripts/build-pages.mjs
      - name: Check generated JavaScript
        run: node --check pages-dist/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
